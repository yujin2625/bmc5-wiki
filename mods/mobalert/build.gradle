plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'com.yujin.mobalert'
base { archivesName = 'mobalert-neoforge-1.21.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client { client() }
    }
    mods {
        mobalert { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

dependencies {
    // Xaero's Minimap 연동용 (컴파일 전용, jar에 포함되지 않음 / 설치돼 있을 때만 사용)
    compileOnly files('libs/xaerominimap-neoforge-1.21.1-26.4.2.jar', 'libs/xaerolib-neoforge-1.21.1-1.7.1.jar')
}
